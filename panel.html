<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; frame-src *; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
  <title>Web Viewer Extension</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="header">
    <div class="button-container">
      <div class="left-icons">
        <button id="btn-x-icon" class="icon-button active">
          <img src="icons/x.svg" alt="X">
        </button>
        <button id="btn-gmgn-icon" class="icon-button">
          <img src="icons/gmgn.svg" alt="GMGN">
        </button>
      </div>
      <div class="right-icons">
        <button id="btn-backward" class="icon-button" title="Back">
          <img src="icons/backward.svg" alt="Back">
        </button>
        <button id="btn-forward" class="icon-button" title="Forward">
          <img src="icons/forward.svg" alt="Forward">
        </button>
        <button id="btn-refresh" class="icon-button" title="Refresh">
          <img src="icons/refresh.svg" alt="Refresh">
        </button>
        <button id="btn-swap" class="icon-button" title="Swap">
          <img src="icons/swap.svg" alt="Swap">
        </button>
        <button id="btn-settings" class="icon-button" title="Settings">
          <img src="icons/settings.svg" alt="Settings">
        </button>
      </div>
    </div>
    <div id="full-screen-mask"></div>
    <div id="settings">
      <h2>Auto-refresh Settings</h2>
      <div class="setting-item">
        <label for="x-refresh-enabled">
          <span class="setting-item-header">On X</span>
          <div class="setting-item-description">
            The X page on the secondary browser will auto-fetch the main browser's token contract address and find top posts linked to it.
          </div>
        </label>
        <div>
          <input type="checkbox" id="x-refresh-enabled" checked>
          <label for="x-refresh-enabled" class="toggle-switch"></label>
        </div>
      </div>
      <div class="setting-item">
        <label for="gmgn-refresh-enabled">
          <span class="setting-item-header">On GMGN</span>
          <div class="setting-item-description">
            The GMGN page on the secondary browser will auto-fetch the main browser's token contract address and find the chart linked to it.
          </div>
        </label>
        <div>
          <input type="checkbox" id="gmgn-refresh-enabled" checked>
          <label for="gmgn-refresh-enabled" class="toggle-switch"></label>
        </div>
      </div>
      <div id="rate-us" class="text-sm">
        Give us 5 stars! ⭐⭐⭐⭐⭐️
      </div>
    </div>
  </header>

  <div class="content">
    <!-- Two separate iframes for each site - empty src to avoid initial loading -->
    <iframe id="iframe-x" class="active" src="https://x.com"></iframe>
    <iframe id="iframe-gmgn" src=""></iframe>
    
    <div id="loading-indicator" class="loading-indicator" style="display: none;">
      <div class="loading-content">
        <div class="loading-spinner"></div>
        <p class="loading-text">Loading content...</p>
      </div>
    </div>

    <div id="failed-to-load-notification">
      <img src="icons/sweating.svg" alt="GMGN">
      <div class="failed-text">
        <p>Failed to load.</p>
        <p class="text-sm">Unknown Error.</p>
      </div>
      <button id="retry-button">Retry</button>
    </div>
  </div>

  <div class="footer">
    <img src="icons/apm.svg" alt="apm.fun">
    <button id="trade-button" class="monospace">
      Quick Trade
    </button>
  </div>

  <div id="notification"></div>

  <!-- Load scripts -->
  <!-- utils.js to be loaded first, used by other scripts -->
  <script src="utils.js"></script>
  <script src="panel.js"></script>
  <script src="twitter_ca_detector.js"></script>
</body>
</html>
