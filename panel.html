<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; frame-src *; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
  <title>Web Viewer Extension</title>
  <style>
    :root {
      --primary-color: #1DA1F2;
      --secondary-color: #14171A;
      --background-color: #FFFFFF;
      --text-color: #14171A;
      --border-color: #E1E8ED;
      --error-color: #E0245E;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--background-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .header {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--background-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .button-container {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
    }
    
    .left-buttons {
      display: flex;
      gap: 16px;
    }
    
    .right-buttons {
      display: flex;
      align-items: center;
    }

    .toggle-btn, .refresh-btn {
      padding: 8px 16px;
      background-color: #EFF3F4;
      color: var(--text-color);
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s ease;
      white-space: nowrap;
    }

    .refresh-btn {
      padding: 8px 12px;
    }

    .toggle-btn:hover, .refresh-btn:hover {
      background-color: #E1E8ED;
    }

    .toggle-btn.active {
      background-color: var(--primary-color);
      color: white;
    }

    .content {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      /* Mobile viewport simulation */
      max-width: 100%;
      margin: 0 auto;
      display: none;
    }

    iframe.active {
      display: block;
    }

    .loading-indicator {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: rgba(255, 255, 255, 0.9);
      z-index: 1000;
    }

    .loading-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      top: 35%;
      transform: translateY(0);
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid var(--primary-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    .loading-text {
      margin: 0;
      padding: 0;
      text-align: center;
      font-size: 16px;
      color: var(--text-color);
    }

    .error-message {
      color: var(--error-color);
      text-align: center;
      padding: 16px;
      max-width: 80%;
      display: none;
      position: fixed;
      top: 50px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #notification {
      position: fixed;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #333;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="button-container">
      <div class="left-buttons">
        <button id="btn-x" class="toggle-btn active">X</button>
        <button id="btn-pmgn" class="toggle-btn">pmgn.ai</button>
      </div>
      <div class="right-buttons">
        <button id="btn-refresh" class="refresh-btn">↻</button>
        &nbsp;&nbsp;Version: 0.0.2
      </div>
    </div>
  </div>

  <div class="content">
    <!-- Two iframes for each content source -->
    <iframe id="iframe-x" class="active" src="https://x.com"></iframe>
    <iframe id="iframe-gmgn" src=""></iframe>
    
    <div id="loading-indicator" class="loading-indicator" style="display: none;">
      <div class="loading-content">
        <div class="loading-spinner"></div>
        <p class="loading-text">Loading content...</p>
      </div>
    </div>
    <div id="notification"></div>
  </div>

  <script src="panel.js"></script>
</body>
</html>
