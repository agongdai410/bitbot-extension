<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; frame-src *; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
  <title>Web Viewer Extension</title>
  <style>
    /* Font imports */
    @font-face {
      font-family: 'Roboto Mono';
      src: url('fonts/RobotoMono-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    
    @font-face {
      font-family: 'IBM Plex Sans';
      src: url('fonts/IBMPlexSans-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    
    @font-face {
      font-family: 'IBM Plex Sans';
      src: url('fonts/IBMPlexSans-Medium.ttf') format('truetype');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    
    /* Utility class for monospace text */
    .monospace {
      font-family: 'Roboto Mono', monospace;
      font-weight: 700;
    }
    
    /* Utility class for medium weight text */
    .medium-weight {
      font-weight: 500;
    }

    :root {
      --primary-color: #FFCD00;
      --secondary-color: #14171A;
      --background-color: #212128;
      --text-color: #0B0C0E;
      --text-white: #FFFFFF;
      --text-secondary: rgba(255, 255, 255, 0.6);
      --border-color: rgba(255, 255, 255, 0.08);
      --error-color: #E0245E;
      --green-color: #83D94F;
      --gray-background: rgba(255, 255, 255, 0.18);
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--background-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    p {
      margin: 5px 0;
    }

    .text-sm {
      font-size: 14px;
      color: var(--text-secondary);
      font-weight: 400;
    }

    .header {
      padding: 9px 12px;
      background-color: var(--background-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    h2 {
      font-size: 16px;
      font-weight: 500;
      margin: 0 0 10px;
      padding: 0;
    }

    #settings {
      display: none;
      position: absolute;
      z-index: 20;
      top: 56px;
      right: 24px;
      width: 288px;
      border-radius: 8px;
      padding: 24px;
      background-color: var(--background-color);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      color: var(--text-white);
    }

    #settings .setting-item {
      margin: 0 0 4px;
      padding: 16px 0;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    #settings .setting-item-header {
      display: block;
      margin: 0 0 4px;
      font-size: 14px;
    }

    #settings .setting-item-description {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 16px;
    }

    #settings #rate-us {
      margin: 16px 0 0;
      text-align: center;
      font-size: 12px;
      cursor: pointer;
    }

    #full-screen-mask {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10;
    }

    .button-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0;
    }
    
    .left-icons {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .right-icons {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .icon-button {
      background: none;
      border: none;
      cursor: pointer;
      padding: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: background-color 0.2s;
    }

    .icon-button:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .icon-button img {
      width: 20px;
      height: 20px;
    }

    .icon-button.active {
      background-color: rgba(255, 255, 255, 0.2);
    }

    .content {
      flex: 1;
      position: relative;
      overflow: hidden;
      padding: 4px;
    }

    #failed-to-load-notification {
      position: absolute;
      z-index: 10;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #000000;
      color: white;
      text-align: center;
      font-size: 16px;
      display: none;
    }

    #failed-to-load-notification .failed-text {
      margin: 20px;
    }

    #failed-to-load-notification #retry-button {
      background-color: var(--gray-background);
      border: none;
      border-radius: 8px;
      width: 160px;
      height: 36px;
      font-weight: 500;
      font-size: 16px;
      cursor: pointer;
      line-height: 36px;
      color: white;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      /* Mobile viewport simulation */
      max-width: 100%;
      margin: 0 auto;
      display: none;
      border-radius: 14px;
    }

    iframe.active {
      display: block;
    }

    .loading-indicator {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: rgba(255, 255, 255, 0.9);
      z-index: 1000;
    }

    .loading-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      top: 35%;
      transform: translateY(0);
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid var(--primary-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    .loading-text {
      margin: 0;
      padding: 0;
      text-align: center;
      font-size: 16px;
      color: var(--text-color);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #notification {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #333;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s;
    }

    #token-search-notification {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #333;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    #token-search-notification button {
      background-color: #1DA1F2;
      color: white;
      border: none;
      border-radius: 3px;
      padding: 5px 10px;
      cursor: pointer;
    }

    #token-search-notification .close-button {
      background-color: transparent;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 16px;
      padding: 0 5px;
    }

    #version-info {
      font-size: 12px;
      margin-left: 10px;
      position: relative;
      bottom: 10px;
      color: #fff;
    }

    .footer {
      margin: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 48px;
    }

    #trade-button {
      background: linear-gradient(180deg, #454545 0%, #232323 100%);
      color: var(--primary-color);
      border: 1px solid #1A1A1A;
      border-radius: 8px;
      cursor: pointer;
      height: 44px;
      line-height: 1;
      flex: 1;
      font-size: 16px;
      box-shadow: 0px -4px 0px 0px #121212 inset;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="button-container">
      <div class="left-icons">
        <button id="btn-x-icon" class="icon-button active">
          <img src="icons/x.svg" alt="X">
        </button>
        <button id="btn-gmgn-icon" class="icon-button">
          <img src="icons/gmgn.svg" alt="GMGN">
        </button>
      </div>
      <div class="right-icons">
        <button id="btn-backward" class="icon-button" title="Back">
          <img src="icons/backward.svg" alt="Back">
        </button>
        <button id="btn-forward" class="icon-button" title="Forward">
          <img src="icons/forward.svg" alt="Forward">
        </button>
        <button id="btn-refresh" class="icon-button" title="Refresh">
          <img src="icons/refresh.svg" alt="Refresh">
        </button>
        <button id="btn-swap" class="icon-button" title="Swap">
          <img src="icons/swap.svg" alt="Swap">
        </button>
        <button id="btn-settings" class="icon-button" title="Settings">
          <img src="icons/settings.svg" alt="Settings">
        </button>
      </div>
    </div>
    <div id="full-screen-mask"></div>
    <div id="settings">
      <h2>Auto-refresh Settings</h2>
      <div class="setting-item">
        <label for="x-refresh-enabled">
          <span class="setting-item-header">On X</span>
          <div class="setting-item-description">
            The X page on the secondary browser will auto-fetch the main browser's token contract address and find top posts linked to it.
          </div>
        </label>
        <div>
          <input type="checkbox" id="x-refresh-enabled" checked>
        </div>
      </div>
      <div class="setting-item">
        <label for="gmgn-refresh-enabled">
          <span class="setting-item-header">On GMGN</span>
          <div class="setting-item-description">
            The GMGN page on the secondary browser will auto-fetch the main browser's token contract address and find the chart linked to it.
          </div>
        </label>
        <div>
          <input type="checkbox" id="gmgn-refresh-enabled" checked>
        </div>
      </div>
      <div id="rate-us" class="text-sm">
        Give us 5 stars! ⭐⭐⭐⭐⭐️
      </div>
    </div>
  </header>

  <div class="content">
    <!-- Two separate iframes for each site - empty src to avoid initial loading -->
    <iframe id="iframe-x" class="active" src="https://x.com"></iframe>
    <iframe id="iframe-gmgn" src=""></iframe>
    
    <div id="loading-indicator" class="loading-indicator" style="display: none;">
      <div class="loading-content">
        <div class="loading-spinner"></div>
        <p class="loading-text">Loading content...</p>
      </div>
    </div>

    <div id="failed-to-load-notification">
      <img src="icons/sweating.svg" alt="GMGN">
      <div class="failed-text">
        <p>Failed to load.</p>
        <p class="text-sm">Unknown Error.</p>
      </div>
      <button id="retry-button">Retry</button>
    </div>
  </div>

  <div class="footer">
    <img src="icons/apm.svg" alt="apm.fun">
    <button id="trade-button" class="monospace">
      Quick Trade
    </button>
  </div>

  <div id="notification"></div>

  <!-- Load scripts -->
  <script src="panel.js"></script>
  <script src="twitter_ca_detector.js"></script>
</body>
</html>
