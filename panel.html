<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; frame-src *; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
  <title>Web Viewer Extension</title>
  <style>
    :root {
      --primary-color: #1DA1F2;
      --secondary-color: #14171A;
      --background-color: #212128;
      --text-color: #0B0C0E;
      --border-color: #E1E8ED;
      --error-color: #E0245E;
      --green-color: #83D94F;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--background-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .header {
      padding: 9px 12px;
      background-color: var(--background-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .button-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0;
    }
    
    .left-icons {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .right-icons {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .icon-button {
      background: none;
      border: none;
      cursor: pointer;
      padding: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: background-color 0.2s;
    }

    .icon-button:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .icon-button img {
      width: 20px;
      height: 20px;
    }

    .icon-button.active {
      background-color: rgba(255, 255, 255, 0.2);
    }

    .content {
      flex: 1;
      position: relative;
      overflow: hidden;
      padding: 4px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      /* Mobile viewport simulation */
      max-width: 100%;
      margin: 0 auto;
      display: none;
      border-radius: 14px;
    }

    iframe.active {
      display: block;
    }

    .loading-indicator {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: rgba(255, 255, 255, 0.9);
      z-index: 1000;
    }

    .loading-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      top: 35%;
      transform: translateY(0);
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid var(--primary-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    .loading-text {
      margin: 0;
      padding: 0;
      text-align: center;
      font-size: 16px;
      color: var(--text-color);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #notification {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #333;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s;
    }

    #token-search-notification {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #333;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    #token-search-notification button {
      background-color: #1DA1F2;
      color: white;
      border: none;
      border-radius: 3px;
      padding: 5px 10px;
      cursor: pointer;
    }

    #token-search-notification .close-button {
      background-color: transparent;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 16px;
      padding: 0 5px;
    }

    #version-info {
      font-size: 12px;
      margin-left: 10px;
      position: relative;
      bottom: 10px;
      color: #fff;
    }

    .footer {
      margin: 8px;
    }

    #trade-button {
      background-color: var(--green-color);
      background-color: var(--green-color);
      color: var(--text-color);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      height: 44px;
      width: 100%;
      font-size: 16px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="button-container">
      <div class="left-icons">
        <button id="btn-x-icon" class="icon-button active">
          <img src="icons/x.svg" alt="X">
        </button>
        <button id="btn-gmgn-icon" class="icon-button">
          <img src="icons/gmgn.svg" alt="GMGN">
        </button>
      </div>
      <div class="right-icons">
        <button id="btn-backward" class="icon-button" title="Back">
          <img src="icons/backward.svg" alt="Back">
        </button>
        <button id="btn-forward" class="icon-button" title="Forward">
          <img src="icons/forward.svg" alt="Forward">
        </button>
        <button id="btn-refresh" class="icon-button" title="Refresh">
          <img src="icons/refresh.svg" alt="Refresh">
        </button>
        <button id="btn-swap" class="icon-button" title="Swap">
          <img src="icons/swap.svg" alt="Swap">
        </button>
        <button id="btn-settings" class="icon-button" title="Settings">
          <img src="icons/settings.svg" alt="Settings">
        </button>
      </div>
    </div>
  </div>

  <div class="content">
    <!-- Two separate iframes for each site - empty src to avoid initial loading -->
    <iframe id="iframe-x" class="active" src=""></iframe>
    <iframe id="iframe-gmgn" src=""></iframe>
    
    <div id="loading-indicator" class="loading-indicator" style="display: none;">
      <div class="loading-content">
        <div class="loading-spinner"></div>
        <p class="loading-text">Loading content...</p>
      </div>
    </div>
  </div>

  <div class="footer">
    <button id="trade-button">
      <img src="icons/bitbot.svg" alt="Bitbot">
      Trade on Bitbot
    </button>
  </div>

  <div id="notification"></div>

  <script src="panel.js"></script>
</body>
</html>
